<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Convolution A/B</title>
<style>
  :root { color-scheme: dark; font: 16px system-ui, sans-serif; background: #071522; color: #dce8f2; }
  body { max-width: 780px; margin: 28px auto; padding: 0 20px; }
  h1 { font-size: 22px; margin: 0 0 24px; color: #53c78c; }
  .controls, .pair { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin: 16px 0; }
  button, input::file-selector-button { padding: 9px 14px; border: 1px solid #426079; border-radius: 5px; background: #14283b; color: inherit; font: inherit; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  button:focus-visible, input:focus-visible, audio:focus-visible { outline: 2px solid #53c78c; outline-offset: 2px; }
  .pair { border-top: 1px solid #274156; padding-top: 18px; }
  .pair strong { width: 100%; }
  audio { width: 100%; }
  #status { color: #aabfcf; white-space: pre-wrap; }
</style>
<h1>Convolution A/B</h1>
<div class="controls">
  <input id="audioFile" aria-label="Open audio" type="file" accept="audio/*">
  <button id="renderButton">Render A/B</button>
</div>
<div id="status" role="status">Select the local test.wav.</div>
<details><summary>1 s boundary measurements</summary><pre id="boundary"></pre></details>
<div class="pair"><strong>Source file · Unmatched level</strong><audio id="audioSource" controls preload="none"></audio></div>
<div class="pair"><strong>Dry oscillator · Unmatched level</strong><audio id="audioDry" controls preload="none"></audio></div>
<div class="pair"><strong>A · Current limiter</strong><audio id="audioA" controls preload="none"></audio></div>
<div class="pair"><strong>B · 5 ms lookahead candidate</strong><audio id="audioB" controls preload="none"></audio></div>
<script type="module">
import { curveDefaults, normFromBaseFrequency, renderFrame, createSmoothingState, edgeFade, encodeWav24 } from '../src/oscillator-core.js';
import { prepareImpulse, renderConvolved } from '../src/convolution.js?v=20261002-stereotail1';
import { StereoSafetyLimiter, SAFETY_CEILING } from '../src/safety-limiter.js';

const rate = 48000;
const sourceFrames = rate;
const status = document.querySelector('#status');
const outputPlayers = [document.querySelector('#audioA'), document.querySelector('#audioB')];
const players = [document.querySelector('#audioSource'), document.querySelector('#audioDry'), ...outputPlayers];
let urls = [];

for (const player of players) player.addEventListener('play', () => {
  for (const other of players) if (other !== player) other.pause();
});

function synthesize() {
  const curves = Object.fromEntries(Object.entries(curveDefaults).map(([key, y]) => [key, [{ x: 0, y }, { x: 1, y }]]));
  curves.basePitch = [{ x: 0, y: normFromBaseFrequency(110) }, { x: 1, y: normFromBaseFrequency(110) }];
  const settings = { waveform: 'saw', stack: 'harmonic', count: 16, modulationMode: 'off', curves };
  const phases = new Float64Array(64);
  const modPhases = new Float64Array(64);
  const smoothing = createSmoothingState();
  const channels = [new Float32Array(sourceFrames), new Float32Array(sourceFrames)];
  for (let i = 0; i < sourceFrames; i++) {
    const frame = renderFrame(settings, i / sourceFrames, rate, phases, modPhases, smoothing);
    const fade = edgeFade(i, sourceFrames, rate);
    channels[0][i] = frame.left * fade;
    channels[1][i] = frame.right * fade;
  }
  return channels;
}

async function paddedConvolution(dry, impulse) {
  const frameCount = dry[0].length + impulse.length - 1;
  const context = new OfflineAudioContext(2, frameCount, rate);
  const buffer = context.createBuffer(2, frameCount, rate);
  dry.forEach((channel, index) => buffer.copyToChannel(channel, index));
  const source = context.createBufferSource();
  source.buffer = buffer;
  const convolver = context.createConvolver();
  convolver.normalize = true;
  convolver.buffer = impulse;
  source.connect(convolver).connect(context.destination);
  source.start();
  const rendered = await context.startRendering();
  return [rendered.getChannelData(0).slice(), rendered.getChannelData(1).slice()];
}

function currentLimiter(input) {
  const channels = input.map(channel => channel.slice());
  const limiter = new StereoSafetyLimiter(rate);
  const gainTrace = new Float32Array(channels[0].length);
  let minimumGain = 1;
  for (let i = 0; i < channels[0].length; i++) {
    const output = limiter.process(channels[0][i], channels[1][i]);
    channels[0][i] = output.left;
    channels[1][i] = output.right;
    gainTrace[i] = limiter.gain;
    minimumGain = Math.min(minimumGain, limiter.gain);
  }
  return { channels, minimumGain, gainTrace };
}

function lookaheadLimiter(input) {
  const channels = input.map(channel => new Float32Array(channel.length));
  const gainTrace = new Float32Array(input[0].length);
  const length = input[0].length;
  const ahead = Math.round(rate * .005);
  const attack = 1 - Math.exp(-1 / (rate * .001));
  const release = 1 - Math.exp(-1 / (rate * .1));
  const queue = new Int32Array(length);
  const amplitudes = Float32Array.from(input[0], (value, i) => Math.max(Math.abs(value), Math.abs(input[1][i])));
  let head = 0;
  let tail = 0;
  let gain = 1;
  let minimumGain = 1;
  for (let i = 0; i < Math.min(ahead, length); i++) {
    while (tail > head && amplitudes[queue[tail - 1]] <= amplitudes[i]) tail--;
    queue[tail++] = i;
  }
  for (let i = 0; i < length; i++) {
    const incoming = i + ahead;
    if (incoming < length) {
      while (tail > head && amplitudes[queue[tail - 1]] <= amplitudes[incoming]) tail--;
      queue[tail++] = incoming;
    }
    while (tail > head && queue[head] < i) head++;
    const futurePeak = tail > head ? amplitudes[queue[head]] : amplitudes[i];
    const target = futurePeak > SAFETY_CEILING ? SAFETY_CEILING / futurePeak : 1;
    gain += (target - gain) * (target < gain ? attack : release);
    if (amplitudes[i] * gain > SAFETY_CEILING) gain = SAFETY_CEILING / amplitudes[i];
    channels[0][i] = input[0][i] * gain;
    channels[1][i] = input[1][i] * gain;
    gainTrace[i] = gain;
    minimumGain = Math.min(minimumGain, gain);
  }
  return { channels, minimumGain, gainTrace };
}

function windowMetrics(channels, start, end, gainTrace = null) {
  const from = Math.round(start * rate);
  const to = Math.min(channels[0].length, Math.round(end * rate));
  const power = [0, 0];
  const maxStep = [0, 0];
  const stepAt = [0, 0];
  let maxGainStep = 0;
  let gainStepAt = 0;
  for (let i = from; i < to; i++) {
    for (let channel = 0; channel < 2; channel++) {
      power[channel] += channels[channel][i] ** 2;
      if (i > 0) {
        const step = Math.abs(channels[channel][i] - channels[channel][i - 1]);
        if (step > maxStep[channel]) { maxStep[channel] = step; stepAt[channel] = i / rate; }
      }
    }
    if (gainTrace && i > 0) {
      const step = Math.abs(gainTrace[i] - gainTrace[i - 1]);
      if (step > maxGainStep) { maxGainStep = step; gainStepAt = i / rate; }
    }
  }
  const rms = power.map(value => Math.sqrt(value / (to - from)));
  return {
    interval: `${start.toFixed(2)}-${end.toFixed(2)} s`,
    rmsL: +rms[0].toFixed(5), rmsR: +rms[1].toFixed(5),
    lrDifferenceDb: +(20 * Math.log10(Math.max(1e-10, rms[0]) / Math.max(1e-10, rms[1]))).toFixed(2),
    maxStepL: +maxStep[0].toFixed(5), maxStepR: +maxStep[1].toFixed(5),
    stepAtL: +stepAt[0].toFixed(5), stepAtR: +stepAt[1].toFixed(5),
    ...(gainTrace ? { maxGainStep: +maxGainStep.toFixed(6), gainStepAt: +gainStepAt.toFixed(5) } : {})
  };
}

function levels(channels) {
  let peak = 0;
  let power = 0;
  for (let i = 0; i < channels[0].length; i++) {
    for (const channel of channels) {
      const sample = channel[i];
      peak = Math.max(peak, Math.abs(sample));
      power += sample * sample;
    }
  }
  return { peak, rms: Math.sqrt(power / (channels.length * channels[0].length)) };
}

document.querySelector('#renderButton').onclick = async event => {
  const file = document.querySelector('#audioFile').files[0];
  if (!file) { status.textContent = 'Select a local audio file.'; return; }
  const button = event.currentTarget;
  button.disabled = true;
  status.textContent = 'Rendering…';
  try {
    const decoder = new OfflineAudioContext(2, 1, rate);
    const decoded = await decoder.decodeAudioData(await file.arrayBuffer());
    const impulse = prepareImpulse(decoder, decoded, 100);
    const dry = synthesize();
    const mixed = await renderConvolved(dry, rate, impulse, 1);
    const paddedMixed = await paddedConvolution(dry, impulse);
    const a = currentLimiter(mixed);
    const b = lookaheadLimiter(mixed);
    const paddedB = lookaheadLimiter(paddedMixed);
    const aLevel = levels(a.channels);
    const bLevel = levels(b.channels);
    const targetRms = Math.min(aLevel.rms, bLevel.rms);
    for (const result of [a, b]) {
      const scale = targetRms / levels(result.channels).rms;
      for (const channel of result.channels) for (let i = 0; i < channel.length; i++) channel[i] *= scale;
    }
    for (const url of urls) URL.revokeObjectURL(url);
    urls = [URL.createObjectURL(file), URL.createObjectURL(encodeWav24(dry, rate)),
      ...[a, b].map(result => URL.createObjectURL(encodeWav24(result.channels, rate)))];
    players.forEach((player, index) => { player.src = urls[index]; player.load(); });
    const finalA = levels(a.channels);
    const finalB = levels(b.channels);
    const windows = [[.9, 1], [1, 1.1]];
    document.querySelector('#boundary').textContent = JSON.stringify({
      dry: windows.map(([start, end]) => windowMetrics(dry, start, end)),
      mixed: windows.map(([start, end]) => windowMetrics(mixed, start, end)),
      paddedMixed: windows.map(([start, end]) => windowMetrics(paddedMixed, start, end)),
      A: windows.map(([start, end]) => windowMetrics(a.channels, start, end, a.gainTrace)),
      B: windows.map(([start, end]) => windowMetrics(b.channels, start, end, b.gainTrace)),
      paddedB: windows.map(([start, end]) => windowMetrics(paddedB.channels, start, end, paddedB.gainTrace)),
      exactBoundaryStep: Object.fromEntries([['mixed', mixed], ['paddedMixed', paddedMixed], ['A', a.channels], ['B', b.channels], ['paddedB', paddedB.channels]].map(([key, channels]) => [key,
        channels.map(channel => +(channel[sourceFrames] - channel[sourceFrames - 1]).toFixed(6))]))
    }, null, 2);
    let differencePower = 0;
    for (let channel = 0; channel < 2; channel++) {
      for (let i = 0; i < a.channels[channel].length; i++) {
        const difference = a.channels[channel][i] - b.channels[channel][i];
        differencePower += difference * difference;
      }
    }
    const differenceRms = Math.sqrt(differencePower / (2 * a.channels[0].length));
    status.textContent = `1 s Saw / Harmonic / 16 · Base 110 Hz · Wet 100% · full IR ${impulse.duration.toFixed(2)} s · 48 kHz / 24-bit\n` +
      `Matched RMS: A ${finalA.rms.toFixed(4)}, B ${finalB.rms.toFixed(4)} · peaks: A ${finalA.peak.toFixed(4)}, B ${finalB.peak.toFixed(4)}\n` +
      `Max gain reduction: A ${(100 * (1 - a.minimumGain)).toFixed(1)}%, B ${(100 * (1 - b.minimumGain)).toFixed(1)}% · A/B difference RMS ${differenceRms.toFixed(4)}. Source and Dry are level-unmatched references. B's lookahead remains experimental.`;
  } catch (error) {
    status.textContent = error.stack || String(error);
  } finally {
    button.disabled = false;
  }
};
</script>
</html>
