<!doctype html><meta charset="utf-8"><title>Oscillator output verification</title><style>body{background:#172026;color:#edf3f2;font:15px system-ui;padding:24px}button{padding:10px}pre{white-space:pre-wrap}</style><h1>Native Worklet / FFT Worker</h1><button id="run">Run output checks</button><pre id="result">Ready</pre><script type="module">
import {curveDefaults,normFromBaseFrequency} from '../src/oscillator-core.js?v=20260928-audio1';
import {SpectrogramAnalysis} from '../src/spectrogram-core.js?v=20260928-fft1';
const curves=Object.fromEntries(Object.entries(curveDefaults).map(([k,y])=>[k,[{x:0,y},{x:1,y}]]));curves.basePitch=[{x:0,y:normFromBaseFrequency(80)},{x:.2,y:normFromBaseFrequency(3000)},{x:.25,y:normFromBaseFrequency(110)},{x:1,y:normFromBaseFrequency(1500)}];
const analyse=settings=>new Promise((resolve,reject)=>{const w=new Worker('../src/fft-worker.js?v=20261002-fixedpan1',{type:'module'});w.onmessage=({data})=>{if(data.result){w.terminate();resolve(data.result);}else if(data.error){w.terminate();reject(Error(data.error));}};w.onerror=e=>{w.terminate();reject(Error(e.message));};w.postMessage(settings);});
document.querySelector('#run').onclick=async()=>{document.querySelector('#run').disabled=true;const rows=[];try{for(const mode of ['off','fm','am','ring']){const settings={waveform:'sine',count:4,stack:'harmonic',modulationMode:mode,modulationRatio:1.5,durationSeconds:1,format:'stereo',curves};const ctx=new OfflineAudioContext(2,48000,48000);await ctx.audioWorklet.addModule('../src/oscillator-worklet.js?v=20261002-fixedpan1');await ctx.audioWorklet.addModule('../src/safety-limiter-worklet.js?v=20261002-fixedpan1');const node=new AudioWorkletNode(ctx,'oscillator-curve-processor',{numberOfInputs:0,outputChannelCount:[2]});const limiter=new AudioWorkletNode(ctx,'oscillator-safety-limiter',{numberOfInputs:1,numberOfOutputs:1,outputChannelCount:[2]});node.connect(limiter).connect(ctx.destination);const started=new Promise(resolve=>{node.port.onmessage=({data})=>{if(data.type==='started')resolve();};});node.port.postMessage({type:'settings',settings});node.port.postMessage({type:'play',token:1});await started;const audio=await ctx.startRendering();const a=new SpectrogramAnalysis(2,48000,48000);a.push([audio.getChannelData(0),audio.getChannelData(1)]);const expected=a.finish(),actual=await analyse(settings);let maxDbError=0;for(let i=0;i<expected.data.length;i++)maxDbError=Math.max(maxDbError,Math.abs(actual.data[i]-expected.data[i]));rows.push({mode,maxDbError,pass:maxDbError<.002});document.querySelector('#result').textContent=JSON.stringify({rows,pass:rows.every(r=>r.pass)},null,2);}}catch(e){document.querySelector('#result').textContent=e.stack;}finally{document.querySelector('#run').disabled=false;}};
</script>
